[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ci-agents"
version = "0.1.0"
description = "Classification Agent + CI Agent for the Actions-embedded CI pipeline"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.60",
    "httpx>=0.27",
    "pydantic>=2.7",
]

[tool.setuptools]
package-dir = { "" = "src" }
packages = ["classification_agent", "ci_agent", "ci_agent.phases"]
py-modules = ["contracts", "report", "telemetry"]
